services:
  app:
    image: cho-thanh-ly:local
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: c2c_used_marketplace
      DB_USER: marketplace
      DB_PASS: ${DB_PASS:-marketplace_local}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/backend/uploads
      - storage:/var/www/html/backend/storage
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: c2c_used_marketplace
      MYSQL_USER: marketplace
      MYSQL_PASSWORD: ${DB_PASS:-marketplace_local}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_local_only}
    volumes:
      - db_data:/var/lib/mysql
      - ./database/001_schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
      - ./database/002_seed.sql:/docker-entrypoint-initdb.d/002_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_PASSWORD\" mysql --protocol=TCP -h 127.0.0.1 -u\"$$MYSQL_USER\" \"$$MYSQL_DATABASE\" -e 'SELECT 1 FROM users LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
  uploads:
  storage:
